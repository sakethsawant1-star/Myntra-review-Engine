name: Discovery Pipeline

on:
  push:
    branches:
      - main
  schedule:
    # 1:30 AM India time (20:00 UTC on the previous day).
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      item_cap:
        description: "Maximum evidence items per run"
        required: false
        default: "40"
      dataset_scope:
        description: "Dataset scope label"
        required: false
        default: "fresh_sample"

permissions:
  contents: read

concurrency:
  group: myntra-discovery-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Collect, annotate, and rank evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-1.5-flash' }}
      PIPELINE_SCOPE: ${{ inputs.dataset_scope || 'fresh_sample' }}
      PIPELINE_CAP: ${{ inputs.item_cap || '40' }}
      PIPELINE_SOURCES: ${{ secrets.PIPELINE_SOURCES || 'google_play,reddit_rss' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Process queued run or run a fresh sample
        run: python scripts/run_scheduled_pipeline.py

      - name: Verify latest run
        run: |
          python -c "import os, sys, psycopg2; conn=psycopg2.connect(os.environ['DATABASE_URL']); cur=conn.cursor(); cur.execute(\"SELECT status, items_collected, items_ai_succeeded FROM collection_runs ORDER BY COALESCE(requested_at, started_at) DESC LIMIT 1\"); row=cur.fetchone(); print(row); sys.exit(1 if not row or row[0] == 'failed' else 0); conn.close()"
